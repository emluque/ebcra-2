user www-data www-data;
worker_processes 4;
error_log logs/error.log;
pid logs/nginx.pid;
worker_rlimit_nofile 8192;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local]  $status '
    '"$request" $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

  log_format custom_cache_log '$remote_addr - $remote_user [$time_local]  $status '
    ' [Cache:$upstream_cache_status] '
    '"$request" $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

  access_log logs/access.log main;
  sendfile on;
  tcp_nopush on;
  server_names_hash_bucket_size 128;
  server_tokens off;

  server {
    listen 80;
    server_name estadisticasbcra.com www.estadisticasbcra.com;
    access_log logs/estadisticasbcra.access.log custom_cache_log;

    location /static/ {
      alias /staticfiles/;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    location / {
      proxy_pass http://ebcra-web:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }

  server {
    listen 80;
    server_name api.estadisticasbcra.com;
    access_log logs/api.estadisticasbcra.access.log main;

    location / {
      proxy_pass http://ebcra-service:9001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
